name: BDD Tests

on:
  workflow_dispatch:
  # Reusable: called by the deploy workflows (deploy-pages.yml,
  # deploy-staging-cloudflare.yml, deploy-preview-cloudflare.yml) so a deploy
  # only proceeds once these tests pass, in the same workflow run. `push` was
  # removed to avoid running the suite twice per push (once standalone, once
  # via the deploy workflow's `workflow_call`). The standalone `pull_request`
  # trigger was also removed: deploy-preview-cloudflare.yml already runs on
  # every pull_request (no branch filter) and calls this workflow via
  # `workflow_call`, so keeping both triggered a redundant second full test
  # run per PR push. The PR check now surfaces as "test / test" (from the
  # preview workflow's reusable call) instead of a separate standalone "test"
  # check.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: bdd-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-logic scenarios (no DOM/browser, see tests/unit/) run under cucumber-js
  # puro on a plain Node runner — no Playwright image, no Hugo fixtures needed,
  # so this job is fast and runs in parallel with test-ui below.
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm run test:unit

  test-ui:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image so CI uses the exact same
    # browser/OS/dependency versions as anyone running tests locally via
    # Docker (see README > Automated tests) — avoids "works on my machine"
    # drift between environments.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Setup Hugo
        # The BDD fixtures are now produced by a real Hugo build (see
        # tests/bdd/support/build-fixtures.mjs), so the test container needs Hugo too.
        uses: ./.github/actions/setup-hugo

      - name: Run BDD test suite
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
