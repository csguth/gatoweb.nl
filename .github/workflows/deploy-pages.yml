name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # Gate the deploy on the BDD test suite passing, in the same workflow run.
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate variables
        env:
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          PRICE_ONE_VISIT: ${{ vars.PRICE_ONE_VISIT }}
          PRICE_TWO_VISITS: ${{ vars.PRICE_TWO_VISITS }}
          DOG_WALK_PRICE_FROM: ${{ vars.DOG_WALK_PRICE_FROM }}
        run: |
          required_vars=(
            WHATSAPP_NUMBER
            BRAND_NAME
            SITE_URL
            CONTACT_EMAIL
            CITY_NAME
            PRICE_ONE_VISIT
            PRICE_TWO_VISITS
            DOG_WALK_PRICE_FROM
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing repository/environment variable: ${var_name}"
              exit 1
            fi
          done

          for n in PRICE_ONE_VISIT PRICE_TWO_VISITS DOG_WALK_PRICE_FROM; do
            value="${!n}"
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "${n} must be numeric"
              exit 1
            fi
          done

      - name: Build site
        uses: ./.github/actions/build-site
        with:
          whatsapp-number: ${{ vars.WHATSAPP_NUMBER }}
          brand-name: ${{ vars.BRAND_NAME }}
          site-url: ${{ vars.SITE_URL }}
          contact-email: ${{ vars.CONTACT_EMAIL }}
          city-name: ${{ vars.CITY_NAME }}
          price-one-visit: ${{ vars.PRICE_ONE_VISIT }}
          price-two-visits: ${{ vars.PRICE_TWO_VISITS }}
          dog-walk-price-from: ${{ vars.DOG_WALK_PRICE_FROM }}
          instagram-handle: ${{ vars.INSTAGRAM_HANDLE || 'gatocatsit' }}
          env-label: ${{ vars.ENV_LABEL }}
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY }}
          business-legal-name: ${{ vars.BUSINESS_LEGAL_NAME }}
          business-address: ${{ vars.BUSINESS_ADDRESS }}
          kvk-number: ${{ vars.KVK_NUMBER }}
          iban-number: ${{ vars.IBAN_NUMBER }}
          btw-exempt: ${{ vars.BTW_EXEMPT }}
          seasonal-surcharge-percent: ${{ vars.SEASONAL_SURCHARGE_PERCENT || 0 }}
          price-extra-cat-per-day: ${{ vars.PRICE_EXTRA_CAT_PER_DAY || 0 }}

      - name: Apply DB migration (production)
        uses: ./.github/actions/apply-db-migration
        with:
          supabase-url: ${{ vars.SUPABASE_URL }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
