name: Deploy PR Preview (Cloudflare Pages)

# Automatically deploys every pull request to its own isolated Cloudflare Pages
# preview URL so a branch can be tested live before merging — without touching
# staging.gatoweb.nl or main. Each PR gets a stable `pr-<number>` preview that is
# re-deployed on every push, and the URL is posted back as a sticky PR comment.
#
# This mirrors the build of deploy-staging-cloudflare.yml and shares the same
# `staging` environment config/secrets (Supabase project, price vars, etc.), so
# test data created here is NOT fully isolated from other staging testing.
#
# Uses `pull_request` (not `pull_request_target`) so repository secrets are only
# available to branches pushed to this repo, never to untrusted forks.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate variables
        env:
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          PRICE_ONE_VISIT: ${{ vars.PRICE_ONE_VISIT }}
          PRICE_TWO_VISITS: ${{ vars.PRICE_TWO_VISITS }}
          DOG_WALK_PRICE_FROM: ${{ vars.DOG_WALK_PRICE_FROM }}
        run: |
          required_vars=(
            WHATSAPP_NUMBER
            BRAND_NAME
            SITE_URL
            CONTACT_EMAIL
            CITY_NAME
            PRICE_ONE_VISIT
            PRICE_TWO_VISITS
            DOG_WALK_PRICE_FROM
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name}" ]; then
              echo "Missing environment variable: ${var_name}"
              exit 1
            fi
          done

          for n in PRICE_ONE_VISIT PRICE_TWO_VISITS DOG_WALK_PRICE_FROM; do
            value="${!n}"
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "${n} must be numeric"
              exit 1
            fi
          done

      - name: Build site
        uses: ./.github/actions/build-site
        with:
          whatsapp-number: ${{ vars.WHATSAPP_NUMBER }}
          brand-name: ${{ vars.BRAND_NAME }}
          site-url: ${{ vars.SITE_URL }}
          contact-email: ${{ vars.CONTACT_EMAIL }}
          city-name: ${{ vars.CITY_NAME }}
          price-one-visit: ${{ vars.PRICE_ONE_VISIT }}
          price-two-visits: ${{ vars.PRICE_TWO_VISITS }}
          dog-walk-price-from: ${{ vars.DOG_WALK_PRICE_FROM }}
          instagram-handle: ${{ vars.INSTAGRAM_HANDLE || 'gatocatsit' }}
          env-label: ${{ vars.ENV_LABEL }}
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-anon-key: ${{ vars.SUPABASE_ANON_KEY }}
          business-legal-name: ${{ vars.BUSINESS_LEGAL_NAME }}
          business-address: ${{ vars.BUSINESS_ADDRESS }}
          kvk-number: ${{ vars.KVK_NUMBER }}
          iban-number: ${{ vars.IBAN_NUMBER }}
          btw-exempt: ${{ vars.BTW_EXEMPT }}
          seasonal-surcharge-percent: ${{ vars.SEASONAL_SURCHARGE_PERCENT || 0 }}
          price-extra-cat-per-day: ${{ vars.PRICE_EXTRA_CAT_PER_DAY || 0 }}

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  test:
    # Only run once the site has built successfully; gates the preview deploy
    # on the BDD test suite passing, in the same workflow run. Runs on
    # `pull_request` (not `pull_request_target`), so this inherits the same
    # no-secrets-for-forks posture as the rest of this workflow; test.yml
    # itself needs no secrets either way.
    needs: build
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Only apply the DB migration once tests have passed, so a failing test
      # run never mutates the shared staging database schema.
      - name: Apply DB migration (staging project, shared by previews)
        uses: ./.github/actions/apply-db-migration
        with:
          supabase-url: ${{ vars.SUPABASE_URL }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy to Cloudflare Pages (staging project, PR preview)
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: gatoweb-nl-staging
          directory: site
          # A stable, per-PR preview branch so every push to the PR re-deploys the
          # same isolated preview (never the real `staging` branch/URL).
          branch: pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.deploy.outputs.url) }};
            const marker = '<!-- cloudflare-pr-preview -->';
            const body = [
              marker,
              '### 🚀 Cloudflare Pages preview',
              '',
              `Preview desta PR: ${url}`,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              '> ⚠️ Compartilha o projeto/dados Supabase de **staging** — dados de teste criados aqui não ficam isolados de outros testes de staging.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
