<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Facturen — __BRAND_NAME__</title>
<meta content="noindex,nofollow" name="robots"/>
<link href="images/favicon.png" rel="icon" type="image/png"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Runtime config (Supabase URL/keys, business info) injected at deploy time -->
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/i18next@23.16.8/dist/umd/i18next.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-static.js"></script>
<script src="js/lang-toggle.js"></script>
<link href="css/site.css" rel="stylesheet"/>
</head>
<body class="min-h-screen" data-env="__ENV_LABEL__" x-data="langToggle()" x-init="init()">
<div class="fixed top-0 inset-x-0 z-[100] bg-amber-400 text-black text-xs md:text-sm font-bold text-center py-1.5" id="env-banner">
    🚧 STAGING — <span class="en-l" data-i18n="staging_banner.test_environment_not_the_live">test environment, not the live site</span><span class="nl-l">testomgeving, niet de live site</span><span class="pt-l">ambiente de testes, não é o site oficial</span>
</div>
<div class="max-w-lg mx-auto px-5 py-10">
<div class="flex items-center justify-between mb-6">
<h1 class="font-serif text-2xl font-bold text-sage-700">🐾 <span class="en-l" data-i18n="facturen.invoices">Invoices</span><span class="nl-l">Facturen</span><span class="pt-l">Faturas</span></h1>
<select aria-label="Switch language" class="text-xs font-semibold border border-sage-200 rounded-full px-3 py-1.5 text-sage-600 bg-white hover:bg-sage-50 transition" x-model="lang">
<option value="en">🇬🇧 EN</option>
<option value="nl">🇳🇱 NL</option>
<option value="pt">🇵🇹 PT</option>
</select>
</div>
<div x-data="facturenApp()" x-init="init()">
<template x-if="!configured">
<div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 text-sm">
<span class="nl-l">Supabase is nog niet geconfigureerd. Voeg de repository variables
        <code>SUPABASE_URL</code> en <code>SUPABASE_ANON_KEY</code> toe en deploy opnieuw.</span>
<span class="en-l" data-i18n="facturen.supabase_is_not_configured_yet">Supabase is not configured yet. Add the repository variables
        <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> and redeploy.</span>
<span class="pt-l">O Supabase ainda não está configurado. Adicione as variáveis do repositório
        <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> e faça novo deploy.</span>
</div>
</template>
<template x-if="configured &amp;&amp; !session">
<form @submit.prevent="login()" class="bg-white rounded-2xl p-6 space-y-4 shadow-sm border border-warm-200">
<div>
<label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
<span class="nl-l">E-mail</span><span class="en-l" data-i18n="facturen.email">Email</span><span class="pt-l">E-mail</span>
</label>
<input autocomplete="username" class="w-full border border-warm-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" required="" type="email" x-model="email"/>
</div>
<div>
<label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
<span class="nl-l">Wachtwoord</span><span class="en-l" data-i18n="facturen.password">Password</span><span class="pt-l">Senha</span>
</label>
<input autocomplete="current-password" class="w-full border border-warm-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" required="" type="password" x-model="password"/>
</div>
<p class="text-red-600 text-xs" x-show="loginError" x-text="loginError"></p>
<button :disabled="loading" class="w-full bg-sage-600 hover:bg-sage-700 disabled:opacity-50 text-white font-semibold py-3 rounded-xl text-sm transition" type="submit">
<span x-show="!loading"><span class="nl-l">Inloggen</span><span class="en-l" data-i18n="facturen.log_in">Log in</span><span class="pt-l">Entrar</span></span>
<span x-show="loading"><span class="nl-l">Bezig...</span><span class="en-l" data-i18n="facturen.working">Working...</span><span class="pt-l">Processando...</span></span>
</button>
</form>
</template>
<template x-if="configured &amp;&amp; session">
<div class="space-y-4">
<div class="flex justify-between items-center">
<p class="text-xs text-gray-500" x-text="session.user.email"></p>
<div class="flex gap-3">
<button @click="loadBookings()" class="text-xs text-sage-600 font-semibold hover:text-sage-700">
<span class="nl-l">↻ Vernieuwen</span><span class="en-l" data-i18n="facturen.refresh">↻ Refresh</span><span class="pt-l">↻ Atualizar</span>
</button>
<button @click="logout()" class="text-xs text-gray-400 hover:text-red-500">
<span class="nl-l">Uitloggen</span><span class="en-l" data-i18n="facturen.log_out">Log out</span><span class="pt-l">Sair</span>
</button>
</div>
</div>
<p class="text-sm text-gray-400 text-center py-10" x-show="loadingList">
<span class="nl-l">Laden...</span><span class="en-l" data-i18n="facturen.loading">Loading...</span><span class="pt-l">Carregando...</span>
</p>
<p class="text-sm text-gray-400 text-center py-10" x-show="!loadingList &amp;&amp; bookings.length === 0">
<span class="nl-l">Geen facturen 🎉</span><span class="en-l" data-i18n="facturen.no_invoices">No invoices 🎉</span><span class="pt-l">Sem faturas 🎉</span>
</p>
<template :key="b.id" x-for="b in bookings">
<div :class="{
                 'border-warm-200': b.status === 'pending',
                 'border-orange-300': b.status === 'approved' &amp;&amp; !b.tikkie_sent,
                 'border-warm-200 opacity-70': b.status === 'approved' &amp;&amp; b.tikkie_sent,
                 'border-gray-200 opacity-50': b.status === 'cancelled'
               }" class="bg-white rounded-2xl p-4 shadow-sm space-y-3 border">
<div class="flex items-center justify-between gap-2">
<span :class="{
                      'bg-amber-100 text-amber-700': b.status === 'pending',
                      'bg-orange-100 text-orange-700': b.status === 'approved' &amp;&amp; !b.tikkie_sent,
                      'bg-green-100 text-green-700': b.status === 'approved' &amp;&amp; b.tikkie_sent,
                      'bg-gray-100 text-gray-500': b.status === 'cancelled'
                    }" class="text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded-full">
<template x-if="b.status === 'pending'"><span><span class="nl-l">Wacht op goedkeuring</span><span class="en-l" data-i18n="facturen.awaiting_approval">Awaiting approval</span><span class="pt-l">Aguardando aprovação</span></span></template>
<template x-if="b.status === 'approved' &amp;&amp; !b.tikkie_sent"><span><span class="nl-l">Tikkie versturen</span><span class="en-l" data-i18n="facturen.send_tikkie">Send Tikkie</span><span class="pt-l">Enviar Tikkie</span></span></template>
<template x-if="b.status === 'approved' &amp;&amp; b.tikkie_sent"><span><span class="nl-l">Voltooid</span><span class="en-l" data-i18n="facturen.completed">Completed</span><span class="pt-l">Concluído</span></span></template>
<template x-if="b.status === 'cancelled'"><span><span class="nl-l">Geannuleerd</span><span class="en-l" data-i18n="facturen.cancelled">Cancelled</span><span class="pt-l">Cancelado</span></span></template>
</span>
<span class="text-[11px] text-gray-400" x-show="b.factuur_number" x-text="'#' + factuurLabel(b)"></span>
</div>
<template x-if="b.status === 'pending'">
<div class="space-y-3">
<div>
<label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wide">
<span class="nl-l">Klant</span><span class="en-l" data-i18n="facturen.client">Client</span><span class="pt-l">Cliente</span>
</label>
<input :placeholder="lang === 'nl' ? 'Naam klant' : (lang === 'pt' ? 'Nome do cliente' : 'Client name')" class="w-full border border-warm-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" type="text" x-model="b.client_name"/>
</div>
<div class="text-sm text-gray-600 space-y-0.5">
<div><span class="font-semibold nl-l">Data:</span><span class="font-semibold en-l" data-i18n="facturen.dates">Dates:</span><span class="font-semibold pt-l">Datas:</span> <span x-text="b.date_from"></span><template x-if="b.date_to"><span> → <span x-text="b.date_to"></span></span></template></div>
<div><span class="font-semibold nl-l">Huisdieren:</span><span class="font-semibold en-l" data-i18n="facturen.pets">Pets:</span><span class="font-semibold pt-l">Animais:</span> <span x-text="petsSummary(b.pets)"></span></div>
<div><span class="font-semibold nl-l">Voorkeur:</span><span class="font-semibold en-l" data-i18n="facturen.preference">Preference:</span><span class="font-semibold pt-l">Preferência:</span> <span x-text="b.preference || '-'"></span></div>
</div>
<div>
<label class="block text-[10px] font-semibold text-gray-400 uppercase tracking-wide">
<span class="nl-l">Bedrag (€)</span><span class="en-l" data-i18n="facturen.amount">Amount (€)</span><span class="pt-l">Valor (€)</span>
</label>
<input class="w-full border border-warm-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-sage-400" step="0.01" type="number" x-model.number="b.final_amount"/>
</div>
<button :disabled="b._busy" @click="approve(b)" class="w-full bg-sage-600 hover:bg-sage-700 disabled:opacity-50 text-white text-sm font-semibold py-2.5 rounded-xl transition">
<span x-show="!b._busy"><span class="nl-l">Goedkeuren &amp; Factuur genereren</span><span class="en-l" data-i18n="facturen.approve_generate_invoice">Approve &amp; generate Invoice</span><span class="pt-l">Aprovar e gerar fatura</span></span>
<span x-show="b._busy"><span class="nl-l">Bezig...</span><span class="en-l" data-i18n="facturen.working_2">Working...</span><span class="pt-l">Processando...</span></span>
</button>
</div>
</template>
<template x-if="b.status !== 'pending'">
<div class="space-y-2">
<div class="text-sm text-gray-700 font-semibold" x-text="b.client_name || '-'"></div>
<div class="text-sm text-gray-600 space-y-0.5">
<div><span class="font-semibold nl-l">Data:</span><span class="font-semibold en-l" data-i18n="facturen.dates_2">Dates:</span><span class="font-semibold pt-l">Datas:</span> <span x-text="b.date_from"></span><template x-if="b.date_to"><span> → <span x-text="b.date_to"></span></span></template></div>
<div><span class="font-semibold nl-l">Huisdieren:</span><span class="font-semibold en-l" data-i18n="facturen.pets_2">Pets:</span><span class="font-semibold pt-l">Animais:</span> <span x-text="petsSummary(b.pets)"></span></div>
<div><span class="font-semibold nl-l">Bedrag:</span><span class="font-semibold en-l" data-i18n="facturen.amount_2">Amount:</span><span class="font-semibold pt-l">Valor:</span> € <span x-text="Number(b.final_amount || 0).toFixed(2)"></span></div>
</div>
<template x-if="b.status === 'approved'">
<div class="flex gap-2 pt-1">
<button @click="downloadPdf(b)" class="flex-1 border border-sage-300 text-sage-700 hover:bg-sage-50 text-xs font-semibold py-2 rounded-xl transition">
<span class="nl-l">📄 PDF downloaden</span><span class="en-l" data-i18n="facturen.download_pdf">📄 Download PDF</span><span class="pt-l">📄 Baixar PDF</span>
</button>
<button :disabled="b._busy" @click="markTikkieSent(b)" class="flex-1 bg-sage-600 hover:bg-sage-700 disabled:opacity-50 text-white text-xs font-semibold py-2 rounded-xl transition" x-show="!b.tikkie_sent">
<span class="nl-l">✓ Tikkie verstuurd</span><span class="en-l" data-i18n="facturen.tikkie_sent">✓ Tikkie sent</span><span class="pt-l">✓ Tikkie enviado</span>
</button>
</div>
</template>
</div>
</template>
</div>
</template>
</div>
</template>
</div>
</div>
<!-- Ligia's staff-only invoicing app — see js/facturen/facturen-app.js -->
<script src="js/facturen/facturen-app.js" type="module"></script>
<!-- Alpine must load after the module script above so window.facturenApp already exists
       when Alpine scans and evaluates x-data on the page. -->
<script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
