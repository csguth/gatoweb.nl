"static.index.about.s1_body" = "Catsitter profissional, resgatista e apaixonada por comportamento felino. Em doze anos já ajudei a resgatar, tratar e encontrar lar para mais de 5.000 gatos."
"static.index.about.s1_title" = "Oi, eu sou a Lígia"
"static.index.about.s2_body" = "Gatos idosos, filhotes, tímidos ou medrosos, pós-operatório e medicação — sempre com manejo respeitoso e sem estresse, adaptado a cada personalidade."
"static.index.about.s2_title" = "Cuidado no ritmo do seu gato"
"static.index.about.s3_body" = "A cada visita observo apetite, caixa de areia e bem-estar — pequenos sinais importam. Você recebe muitas fotos, vídeos e updates. Ah, e também rego suas plantas. 🪴"
"static.index.about.s3_title" = "Enquanto você estiver fora"
"static.index.about.s4_body" = "Também ofereço consultas de comportamento felino — arranhões, problemas na caixa de areia, apresentação entre gatos ou simplesmente entender melhor seu gato. A gente resolve junto."
"static.index.about.s4_title" = "Entendendo seu gato"
"static.index.about.s5_body" = "Coelhos, porquinhos-da-índia, aves, cobras, lagartos — adoro conhecer cada espécie e sigo suas instruções à risca para manter a rotina deles igual."
"static.index.about.s5_title" = "Além dos gatos"
"static.index.about.s6_body" = "E sim, também ofereço passeios com cães! Tive cães a vida toda e passeio com cães de todos os tamanhos e temperamentos, com atenção à segurança e à coleira. Espero virar amiga de longa data do seu melhor amigo. 🖤"
"static.index.about.s6_title" = "Cães também são bem-vindos"
