"static.index.about.s1_body" = "Professionele kattenoppas, kattenredder en gedragsenthousiast. In twaalf jaar heb ik meegeholpen meer dan 5.000 katten te redden, te behandelen en een thuis te geven."
"static.index.about.s1_title" = "Hoi, ik ben Lígia"
"static.index.about.s2_body" = "Seniore katten, kittens, schuwe of angstige katten, postoperatieve zorg en medicatie — altijd met stressvrije, respectvolle omgang, aangepast aan elke kat."
"static.index.about.s2_title" = "Zorg op het tempo van je kat"
"static.index.about.s3_body" = "Bij elk bezoek let ik op eetlust, kattenbak en welzijn — kleine dingen tellen. Je krijgt volop foto’s, video’s en updates. En ja, ik geef ook je planten water. 🪴"
"static.index.about.s3_title" = "Terwijl je weg bent"
"static.index.about.s4_body" = "Ik bied ook gedragsconsulten voor katten aan — krabgedrag, kattenbakproblemen, het introduceren van katten, of gewoon je kat beter begrijpen. Dat zoeken we samen uit."
"static.index.about.s4_title" = "Je kat begrijpen"
"static.index.about.s5_body" = "Konijnen, cavia's, vogels, slangen, hagedissen — ik leer graag elke soort kennen en volg je instructies nauwkeurig, zodat hun routine hetzelfde blijft."
"static.index.about.s5_title" = "Meer dan katten"
"static.index.about.s6_body" = "En ja, ik bied ook hondenuitlaatservice aan! Ik heb mijn hele leven honden gehad en loop met honden van alle formaten en karakters, met oog voor veiligheid en lijngedrag. Ik hoop een blijvende vriend te worden voor je beste vriend. 🖤"
"static.index.about.s6_title" = "Honden ook welkom"
