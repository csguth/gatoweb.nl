"static.index.reviews.communication" = "Communication"
"static.index.reviews.i_couldn_t_have_asked" = "\"I couldn't have asked for a better cat sitter! Ligia took care of my baby as if it were her own, showing so much love, patience, and attention. She was incredibly attentive to my cat's needs and made sure Jazzy felt comfortable and safe. I received regular updates and could tell my cat was happy and relaxed. I highly recommend Ligia to anyone looking for a trustworthy, caring, and professional pet sitter.\""
"static.index.reviews.k_van_dog_walking_january" = "— Kıvanç · Dog walking · January 2026"
"static.index.reviews.l_gia_was_great_with" = "\"Lígia was great with my dog. She was very friendly, easy to communicate with, and always responsive. She took good care of her, spent time playing with her, and kept me updated with photos. It was so clear she gives real attention and care. I would happily book her again and definitely recommend her.\""
