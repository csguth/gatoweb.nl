"static.index.about.s1_body" = "A professional catsitter, cat rescuer and feline behaviour enthusiast. Over twelve years I've helped rescue, treat and rehome more than 5,000 cats."
"static.index.about.s1_title" = "Hi, I'm Lígia"
"static.index.about.s2_body" = "Senior cats, kittens, shy or fearful cats, post-op and medication — I always use low-stress, respectful handling and adapt to each cat's personality."
"static.index.about.s2_title" = "Care at your cat's pace"
"static.index.about.s3_body" = "Every visit I check appetite, litter box and wellbeing — small changes matter. You'll get plenty of photos, videos and updates. And yes, I'll water your plants too. 🪴"
"static.index.about.s3_title" = "While you're away"
"static.index.about.s4_body" = "I also offer feline behaviour consultations — scratching, litter box troubles, introductions between cats, or simply understanding your cat better. Let's figure it out together."
"static.index.about.s4_title" = "Understanding your cat"
"static.index.about.s5_body" = "Rabbits, guinea pigs, birds, snakes, lizards — I love getting to know every species and follow your care instructions closely so their routine stays the same."
"static.index.about.s5_title" = "More than cats"
"static.index.about.s6_body" = "And yes, I also offer dog walks! I've had dogs my whole life and walk dogs of all sizes and personalities, with care for safety and leash manners. I hope to become a lasting friend to your best friend. 🖤"
"static.index.about.s6_title" = "Dogs are welcome too"
